<app-navbar></app-navbar>

<div class="layout">
  <aside class="sidebar">
    <nav>
      <ul>
        <li><a routerLink="/dashboard">Inicio</a></li>
        <li><a routerLink="/eventos">Eventos</a></li>

        <!-- Promociones e información -->
        <li class="menu-item">
          <button 
            class="accordion-header"
            (click)="toggleAccordion()"
            [class.active]="isAccordionOpen"
          >
            <span class="title">Acerca de nosotros</span>
            <i class="arrow" [class.rotate]="isAccordionOpen">⌄</i>
          </button>

          <ul class="accordion-body" [class.show]="isAccordionOpen">
            <li><a routerLink="/empresa" (click)="onSubItemClick()">Sobre la Empresa</a></li>
            <li><a routerLink="/terminos" (click)="onSubItemClick()">Términos y Condiciones</a></li>
            <li><a routerLink="/privacidad" (click)="onSubItemClick()">Política de Privacidad</a></li>
            <li><a routerLink="/ayuda" (click)="onSubItemClick()">Ayuda / FAQ</a></li>
          </ul>
        </li>
        <li><a routerLink="/promociones">Promociones</a></li>

        <!-- conciertos y transporte -->
        <li><a routerLink="/conciertos">Conciertos</a></li>
        <li><a routerLink="/transporte">Transporte</a></li>

        <!-- Productos y compras -->
        <li><a routerLink="/productos">Productos / Extras</a></li>
        <li class="cart-link">
          <a routerLink="/checkout">Carrito / Pagar</a>
        </li>
      </ul>
    </nav>
  </aside>

  <main class="main-content">
    <router-outlet></router-outlet>
  </main>
</div>
